<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Search App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body> 
    <h1>Pokémon Search App</h1>
    <main>
        <div id="container">
            <form id="search-form">
                <lable for="search-input">Search for Pokémon</lable>
                <input type="text" id="search-input" placeholder="Enter Pokémon name or id" required/>
                <button id="search-button">Search</button>
            </form>
            <div id="search-results">
                <div id="results-top">
                    <div id="name-id">
                        <p id="pokemon-name"></p>
                        <p id="pokemon-id"></p>
                    </div>
                    <div id="size">
                        <p id="weight"></p>
                        <p id="height"></p>
                    </div>
                    <div id="sprite-container" class="sprite-container"></div>
                    <div id="types"></div>
                </div>
                <div id="results-bottom">
                    <table>
                        <tr>
                            <th>Base</th>
                            <th>Stats</th>
                        </tr>
                        <tr>
                            <td>HP:</td>
                            <td id="hp"></td>
                        </tr>
                        <tr>
                            <td>Attack:</td>
                            <td id="attack"></td>
                        </tr>
                        <tr>
                            <td>Defense:</td>
                            <td id="defense"></td>
                        </tr>
                        <tr>
                            <td>Sp. Attack:</td>
                            <td id="special-attack"></td>
                        </tr>
                        <tr>
                            <td>Sp. Defense:</td>
                            <td id="special-defense"></td>
                        </tr>
                        <tr>
                            <td>Speed:</td>
                            <td id="speed" class="speed"></td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
      <script src="./script.js"></script>
    </main>
  </body>
</html>
